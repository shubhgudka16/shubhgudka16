    <style>
      @keyframes floatA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(-4px); }
        50% { transform: translateY(5px); }
      }
      @keyframes floatC {
        0%, 100% { transform: translateY(2px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .float-a { animation: floatA 4.2s ease-in-out infinite; }
      .float-b { animation: floatB 4.8s ease-in-out infinite; }
      .float-c { animation: floatC 4.5s ease-in-out infinite; }
      .float-slow { animation: floatSlow 6s ease-in-out infinite; }
      .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }
    </style>
