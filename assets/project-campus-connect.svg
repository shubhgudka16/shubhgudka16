  <rect x="296" y="36" width="52" height="48" rx="12" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.4"/>
  <g><polygon points="310.74,61.35 322.0,67.85 322.0,75.0 310.74,68.5" fill="#F97316" stroke="#7C2D12" stroke-width="0.9" stroke-linejoin="round"/><polygon points="333.26,61.35 322.0,67.85 322.0,75.0 333.26,68.5" fill="#C2410C" stroke="#7C2D12" stroke-width="0.9" stroke-linejoin="round"/><polygon points="322.0,54.85 333.26,61.35 322.0,67.85 310.74,61.35" fill="#FDE68A" stroke="#7C2D12" stroke-width="0.9" stroke-linejoin="round"/></g>
