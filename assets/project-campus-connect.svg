  <text x="24" y="122" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13">A full web application for campus use,</text>
  <text x="24" y="141" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13">with a responsive frontend, PHP backend,</text>
  <text x="24" y="160" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13">and relational SQL database.</text>

